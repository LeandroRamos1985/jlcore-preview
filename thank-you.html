<!doctype html>
<html lang="pt-BR" data-lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle">Obrigado | Ana Roque — PIA Realty</title>
<meta name="description" id="pageDesc" content="Recebemos sua mensagem. Ana Roque entrará em contato em breve.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.anaroquerealty.com/thank-you.html">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15120d; --ivory:#f6f1e6; --champagne:#c6a15b; --champagne-deep:#8a6a35;
  --serif:"Fraunces", Georgia, serif; --sans:"Manrope", sans-serif;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--ink); color:var(--ivory); font-family:var(--sans); min-height:100svh; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center;}
.wrap{max-width:600px;}
.check{width:64px; height:64px; border:1px solid var(--champagne); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 28px;}
h1{font-family:var(--serif); font-weight:400; font-size:clamp(1.8rem,4vw,2.6rem); margin:0 0 18px;}
p{color:rgba(246,241,230,0.8); line-height:1.6; margin:0 0 30px;}
.actions{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
.btn{display:inline-flex; align-items:center; gap:8px; padding:14px 26px; border-radius:999px; font-weight:600; font-size:0.9rem;}
.btn-gold{background:var(--champagne); color:var(--ink); text-decoration:none;}
.btn-outline{border:1px solid rgba(246,241,230,0.3); color:var(--ivory); text-decoration:none;}
.lang-switch{margin-top:40px; display:inline-flex; gap:2px; border:1px solid rgba(246,241,230,0.2); border-radius:999px; padding:3px;}
.lang-switch button{background:none; border:none; color:var(--ivory); font-family:var(--sans); font-weight:700; font-size:0.72rem; padding:6px 12px; border-radius:999px; cursor:pointer;}
.lang-switch button[aria-pressed="true"]{background:var(--champagne); color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <div class="check" aria-hidden="true">
    <svg width="26" height="26" viewBox="0 0 26 26"><path d="M5 13l6 6L21 7" stroke="#c6a15b" stroke-width="2" fill="none"/></svg>
  </div>
  <h1 data-i18n="ty_title">Mensagem recebida.</h1>
  <p data-i18n="ty_body">Obrigado pelo contato. Ana Roque (ou sua equipe) vai analisar suas informações e retornar em até 24 horas úteis, no idioma de sua preferência.</p>
  <div class="actions">
    <a href="https://wa.me/16172019188" target="_blank" rel="noopener" class="btn btn-gold" data-i18n="ty_whatsapp">Falar agora no WhatsApp</a>
    <a href="index.html" class="btn btn-outline" data-i18n="ty_back">Voltar ao site</a>
  </div>
  <div class="lang-switch" role="group" aria-label="Language">
    <button data-lang-btn="pt" aria-pressed="true">PT</button>
    <button data-lang-btn="en" aria-pressed="false">EN</button>
    <button data-lang-btn="es" aria-pressed="false">ES</button>
  </div>
</div>
<script>
const tyTranslations = {
  pt:{ title:"Obrigado | Ana Roque — PIA Realty", desc:"Recebemos sua mensagem. Ana Roque entrará em contato em breve.",
       ty_title:"Mensagem recebida.", ty_body:"Obrigado pelo contato. Ana Roque (ou sua equipe) vai analisar suas informações e retornar em até 24 horas úteis, no idioma de sua preferência.",
       ty_whatsapp:"Falar agora no WhatsApp", ty_back:"Voltar ao site" },
  en:{ title:"Thank You | Ana Roque — PIA Realty", desc:"We received your message. Ana Roque will be in touch shortly.",
       ty_title:"Message received.", ty_body:"Thanks for reaching out. Ana Roque (or her team) will review your details and get back to you within 24 business hours, in your preferred language.",
       ty_whatsapp:"Chat now on WhatsApp", ty_back:"Back to the site" },
  es:{ title:"Gracias | Ana Roque — PIA Realty", desc:"Recibimos su mensaje. Ana Roque se pondrá en contacto pronto.",
       ty_title:"Mensaje recibido.", ty_body:"Gracias por escribir. Ana Roque (o su equipo) revisará su información y le responderá dentro de 24 horas hábiles, en el idioma de su preferencia.",
       ty_whatsapp:"Hablar ahora por WhatsApp", ty_back:"Volver al sitio" }
};
function applyTyLang(lang){
  const d = tyTranslations[lang] || tyTranslations.pt;
  document.documentElement.lang = lang === "pt" ? "pt-BR" : lang;
  document.getElementById("pageTitle").textContent = d.title;
  document.getElementById("pageDesc").setAttribute("content", d.desc);
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(d[key]) el.textContent = d[key];
  });
  document.querySelectorAll("[data-lang-btn]").forEach(btn=>{
    btn.setAttribute("aria-pressed", btn.getAttribute("data-lang-btn")===lang ? "true":"false");
  });
}
document.querySelectorAll("[data-lang-btn]").forEach(btn=>{
  btn.addEventListener("click", ()=> applyTyLang(btn.getAttribute("data-lang-btn")));
});
const qsLang = new URLSearchParams(window.location.search).get("lang");
applyTyLang(qsLang && tyTranslations[qsLang] ? qsLang : "pt");

// Conversion event fires once, real analytics ID to be wired at deploy
window.dataLayer = window.dataLayer || [];
window.dataLayer.push({ event: "lead_conversion", page: "thank-you" });
</script>
</body>
</html>
